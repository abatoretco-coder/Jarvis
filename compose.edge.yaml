services:
  jarvis:
    environment:
      PUBLIC_EDGE_ENABLED: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      ALLOWED_ORIGINS: http://tauri.localhost,${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,172.30.91.10/32
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?EDGE_PROXY_SECRET is required}
      SERVICE_API_KEYS_JSON: ${SERVICE_API_KEYS_JSON:?SERVICE_API_KEYS_JSON is required}
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-300}
      OIDC_ISSUER_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}/realms/jarvis
      OIDC_JWKS_URL: http://identity-edge-origin:8080/realms/jarvis/protocol/openid-connect/certs
      OIDC_ALLOW_INSECURE_HTTP: "false"
      OIDC_JWKS_ALLOW_INTERNAL_HTTP: "true"
      INTEGRATION_OAUTH_REDIRECT_URI: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}/v1/integrations/oauth/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      SPOTIFY_WEBAPI_CLIENT_ID: ${SPOTIFY_WEBAPI_CLIENT_ID:-}
      SPOTIFY_WEBAPI_CLIENT_SECRET: ${SPOTIFY_WEBAPI_CLIENT_SECRET:-}
    networks:
      default: {}
      edge-internal:
        ipv4_address: 172.30.91.20
        aliases: [jarvis-edge-origin]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8090/ready',{headers:{'X-Jarvis-Edge-Secret':process.env.EDGE_PROXY_SECRET,'X-Forwarded-Proto':'https','X-Forwarded-Host':new URL(process.env.PUBLIC_BASE_URL).host}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))

  identity:
    command: start --import-realm
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.30.91.10/32
    networks:
      default: {}
      edge-internal:
        ipv4_address: 172.30.91.30
        aliases: [identity-edge-origin]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  edge:
    profiles: [pc-preprod-full]
    image: caddy:2.11.7-alpine
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required}
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?EDGE_PROXY_SECRET is required}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:?CADDY_TLS_MODE is required}
    ports:
      - ${JARVIS_EDGE_BIND_HOST:-127.0.0.1}:${JARVIS_EDGE_HTTP_PORT:-8080}:80
      - ${JARVIS_EDGE_BIND_HOST:-127.0.0.1}:${JARVIS_EDGE_HTTPS_PORT:-8443}:443
    volumes:
      - ./ops/edge/Caddyfile.pc-edge:/etc/caddy/Caddyfile:ro
      - ../Jarvis Desktop/dist:/srv/jarvis-web:ro
      - edge-data:/data
      - edge-config:/config
    depends_on:
      jarvis:
        condition: service_healthy
      identity:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      default: {}
      edge-internal:
        ipv4_address: 172.30.91.10

networks:
  edge-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.91.0/24

volumes:
  edge-data:
  edge-config:
